<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Daily AI Helper</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%236d5ef0' d='M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{--bg:#f4f5f8;--panel:#fff;--panel2:#edeff3;--text:#161a22;--muted:#6a7180;--line:#e4e7ec;--pri:#5b5bd6;--grad:linear-gradient(135deg,#4f46e5,#8b5cf6);--ubub:#e9ebff;--shadow:0 10px 30px rgba(25,30,60,.10);--danger:#dc2626}
[data-theme=dark]{--bg:#0d0f14;--panel:#151920;--panel2:#1e242e;--text:#e7eaf0;--muted:#9aa4b2;--line:#272e39;--ubub:#252c40;--shadow:0 10px 30px rgba(0,0,0,.45)}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
select,input,textarea{font:inherit;color:var(--text)}
svg{display:block}
#app{display:flex;height:100dvh}
#sidebar{width:290px;flex:none;background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:12px;z-index:40}
.shead{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.logo{width:34px;height:34px;flex:none;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.35)}
.logo svg{width:18px;height:18px}
.bname{font-size:15px;letter-spacing:-.2px}
#btnCloseSide{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.35)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.wide{width:100%}
.btn svg{width:16px;height:16px}
.slabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 4px}
#sideChats{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin-inline:-6px;padding-inline:6px}
.schat{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;cursor:pointer}
.schat:hover{background:var(--panel2)}
.schat.active{background:var(--panel2);box-shadow:inset 3px 0 0 var(--pri)}
[dir=rtl] .schat.active{box-shadow:inset -3px 0 0 var(--pri)}
.schat .t{flex:1;min-width:0}
.schat .t b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.schat .t span{font-size:11px;color:var(--muted)}
.schat .del{opacity:0;color:var(--muted);padding:6px;border-radius:8px;flex:none}
.schat:hover .del{opacity:1}
.schat .del:hover{color:var(--danger)}
.schat .del svg{width:15px;height:15px}
.sfoot{font-size:11px;color:var(--muted);text-align:center;padding:6px}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;opacity:0;pointer-events:none;transition:.25s}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
#btnMenu{display:none}
.spacer{flex:1}
.ibtn{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ibtn:hover{background:var(--panel2);color:var(--text)}
.ibtn svg{width:19px;height:19px}
#chatScroll{flex:1;overflow-y:auto}
#chatArea{max-width:860px;margin:0 auto;padding:20px 16px 12px}
.msg{display:flex;flex-direction:column;gap:2px;margin:14px 0;align-items:flex-start}
.msg.user{align-items:flex-end}
.bubble{max-width:86%;padding:11px 14px;border-radius:18px;line-height:1.55;font-size:15px;word-break:break-word}
.msg.user .bubble{background:var(--ubub);border-end-end-radius:6px}
.msg.model .bubble{background:var(--panel);border:1px solid var(--line);border-end-start-radius:6px;max-width:94%}
.atts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.atts img{width:120px;height:120px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border-radius:10px;padding:6px 10px;font-size:12px;max-width:220px}
.fchip svg{width:13px;height:13px;flex:none}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md p{margin:.45em 0}
.md h1,.md h2,.md h3,.md h4{margin:.7em 0 .35em}
.md ul,.md ol{padding-inline-start:22px;margin:.4em 0}
.md li{margin:.15em 0}
.md pre{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;margin:.6em 0;font-size:13px}
.md code.ic{background:var(--panel2);padding:1.5px 6px;border-radius:6px;font-size:.9em}
.md pre code{background:none;padding:0}
.md a{color:var(--pri)}
.md blockquote{border-inline-start:3px solid var(--pri);padding-inline-start:12px;color:var(--muted);margin:.5em 0}
.md hr{border:none;border-top:1px solid var(--line);margin:.8em 0}
.acts{display:flex;gap:2px;margin-top:4px}
.abtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.abtn:hover{background:var(--panel2);color:var(--text)}
.abtn svg{width:15px;height:15px}
.genimg{max-width:min(420px,80vw);border-radius:14px;border:1px solid var(--line);display:block;margin-bottom:4px}
.think{display:inline-flex;gap:5px;padding:4px 2px}
.think i{width:7px;height:7px;border-radius:50%;background:var(--pri);animation:bl 1.2s infinite}
.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.err{color:var(--danger);font-size:13.5px;margin-top:4px}
.welcome{display:flex;flex-direction:column;align-items:center;text-align:center;padding:5vh 10px 20px;gap:8px}
.wlogo{width:64px;height:64px;border-radius:20px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 10px 30px rgba(99,102,241,.4);margin-bottom:6px}
.wlogo svg{width:32px;height:32px}
.welcome h1{font-size:clamp(22px,4vw,30px);font-weight:800;letter-spacing:-.4px}
.welcome>p{color:var(--muted);max-width:520px;font-size:14.5px}
.keycard{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:var(--shadow);max-width:420px}
.wcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;width:100%;max-width:680px;margin-top:18px}
.wcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;cursor:pointer;text-align:start;transition:.15s}
.wcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--pri)}
.wcard .ic{width:34px;height:34px;border-radius:10px;background:var(--ubub);color:var(--pri);display:grid;place-items:center;margin-bottom:2px}
.wcard .ic svg{width:17px;height:17px}
.wcard b{font-size:14px}
.wcard span{font-size:12px;color:var(--muted)}
.wchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;max-width:680px}
.wchip2{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--muted)}
.wchip2:hover{color:var(--text);border-color:var(--pri)}
#composerWrap{flex:none;border-top:1px solid var(--line);background:var(--panel);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
#modeBar{max-width:860px;margin:0 auto 8px;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.mchip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:var(--panel2);color:var(--muted);font-size:13px;font-weight:600;flex:none}
.mchip svg{width:15px;height:15px}
.mchip.active{background:var(--grad);color:#fff}
.bar{max-width:860px;margin:0 auto 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar select{flex:1;min-width:120px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;outline:none}
#attachRow{max-width:860px;margin:0 auto 6px;display:flex;flex-wrap:wrap;gap:6px}
#attachRow .fchip button{color:var(--muted);display:grid;place-items:center}
#attachRow .fchip button svg{width:12px;height:12px}
#composer{max-width:860px;margin:0 auto;display:flex;align-items:flex-end;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:8px}
#composer:focus-within{border-color:var(--pri)}
#input{flex:1;background:none;border:none;outline:none;resize:none;max-height:160px;padding:8px 6px;line-height:1.5;font-size:15px}
#btnSend{width:42px;height:42px;flex:none;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(99,102,241,.35)}
#btnSend.streaming{background:var(--danger)}
#btnSend svg{width:18px;height:18px}
#btnMic.listening{color:var(--danger);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.45}}
.cfoot{max-width:860px;margin:6px auto 0;text-align:center;font-size:11px;color:var(--muted)}
#modalWrap{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#modal{width:min(480px,100%);max-height:88dvh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.mhead{display:flex;justify-content:space-between;align-items:center}
.mhead h2{font-size:18px}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:4px}
#modal select,#modal input[type=password],#modal input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;outline:none}
#modal input:focus,#modal select:focus{border-color:var(--pri)}
.keyrow{display:flex;gap:6px}
.keyrow input{flex:1}
.linky{font-size:13px;color:var(--pri);text-decoration:none;font-weight:600}
.linky:hover{text-decoration:underline}
.chk{display:flex;gap:10px;align-items:center;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--pri)}
.secnote{font-size:12px;color:var(--muted);background:var(--panel2);padding:10px 12px;border-radius:10px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2430;color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
@media(max-width:820px){
 #sidebar{position:fixed;inset-inline-start:0;top:0;bottom:0;transform:translateX(-105%);transition:.28s;box-shadow:var(--shadow)}
 [dir=rtl] #sidebar{transform:translateX(105%)}
 #sidebar.open{transform:translateX(0)!important}
 #backdrop.show{opacity:1;pointer-events:auto}
 #btnMenu{display:grid}
 #btnCloseSide{display:grid}
 .bubble{max-width:92%}
 #input{font-size:16px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="shead">
      <div class="brand"><span class="logo" id="logo1"></span><span class="bname">Daily AI Helper</span></div>
      <button class="ibtn" id="btnCloseSide"></button>
    </div>
    <button class="btn primary" id="btnNew"></button>
    <div class="slabel" data-i18n="chats"></div>
    <div id="sideChats"></div>
    <div class="sfoot" data-i18n="powered"></div>
  </aside>
  <div id="backdrop"></div>
  <main id="main">
    <header id="topbar">
      <button class="ibtn" id="btnMenu"></button>
      <div class="brand"><span class="logo" id="logo2"></span><span class="bname">Daily AI Helper</span></div>
      <span class="spacer"></span>
      <button class="ibtn" id="btnTheme"></button>
      <button class="ibtn" id="btnSettings"></button>
    </header>
    <div id="chatScroll"><div id="chatArea"></div></div>
    <div id="composerWrap">
      <div id="modeBar"></div>
      <div id="translateBar" class="bar" hidden>
        <select id="selFrom"></select><button class="ibtn" id="btnSwap"></button><select id="selTo"></select>
      </div>
      <div id="writeBar" class="bar" hidden></div>
      <div id="attachRow"></div>
      <div id="composer">
        <button class="ibtn" id="btnAttach" data-i18n-tip="tipAttach"></button>
        <textarea id="input" rows="1" dir="auto"></textarea>
        <button class="ibtn" id="btnMic" data-i18n-tip="tipMic"></button>
        <button id="btnSend" data-i18n-tip="tipSend"></button>
      </div>
      <div class="cfoot" data-i18n="powered"></div>
    </div>
  </main>
</div>

<div id="modalWrap" hidden>
  <div id="modal">
    <div class="mhead"><h2 data-i18n="settings"></h2><button class="ibtn" id="mClose"></button></div>
    <label class="lbl" data-i18n="keyLabel"></label>
    <div class="keyrow"><input id="mKey" type="password" placeholder="AIza… (optional)" autocomplete="off"><button class="ibtn" id="mEye"></button></div>
    <a class="linky" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" data-i18n="getKey"></a>
    <label class="lbl" data-i18n="language"></label><select id="selLang"></select>
    <label class="lbl" data-i18n="model"></label>
    <select id="selModel"><option value="gemini-2.5-flash">Gemini 2.5 Flash — fast</option><option value="gemini-2.5-pro">Gemini 2.5 Pro — powerful</option></select>
    <label class="lbl" data-i18n="theme"></label>
    <select id="selTheme"><option value="light" data-i18n="light"></option><option value="dark" data-i18n="dark"></option></select>
    <label class="chk"><input type="checkbox" id="chkSpeak"><span data-i18n="autoSpeak"></span></label>
    <p class="secnote" data-i18n="secNote"></p>
    <button class="btn primary wide" id="mSave" data-i18n="save"></button>
    <button class="btn danger wide" id="mClear" data-i18n="clearAll"></button>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="fileInput" multiple hidden accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.xml,.yml,.yaml,.log">

<script>

:'<path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z" fill="currentColor" stroke="none"/>',eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

/* ================= i18n ================= */
const I18N={
en:{newChat:"New chat",chats:"Chats",settings:"Settings",mChat:"Chat",mWrite:"Write",mTranslate:"Translate",mImage:"Image",dChat:"Ask anything",dWrite:"Scripts, emails & posts",dTranslate:"30+ languages",dImage:"Create images from text",phChat:"Message Daily AI Helper…",phImage:"Describe the image you want…",tipAttach:"Upload file or image",tipMic:"Voice input",tipSend:"Send",copy:"Copy",copied:"Copied!",share:"Share",speak:"Read aloud",regen:"Regenerate",download:"Download",thinking:"Thinking…",welcomeTitle:"How can I help you today?",welcomeSub:"Chat, write, translate, create images and analyze files — all in one place.",needKey:"Add your free Gemini API key to start.",getKey:"Get free API key",keyLabel:"Gemini API key",save:"Save",saved:"Saved",language:"Language",theme:"Theme",light:"Light",dark:"Dark",autoSpeak:"Read replies aloud",model:"AI model",clearAll:"Delete all chats",confirmClear:"Delete all chats?",confirmDelete:"Delete this chat?",errKey:"Please add a Gemini API key in Settings (or the server key is missing).",errGeneric:"Something went wrong. Please try again.",errLimit:"Too many requests. Please wait a moment and try again.",errNet:"Network error. Check your internet connection and try again.",auto:"Auto detect",listening:"Listening…",micNo:"Voice input isn't supported in this browser.",fileBig:"File too large (max 8 MB).",today:"Today",yesterday:"Yesterday",empty:"No chats yet",powered:"Powered by Google Gemini",wBlog:"Blog post",wEmail:"Email",wScript:"YouTube script",wAd:"Ad copy",wCaption:"Caption",pBlog:"Write a well-structured blog post about: ",pEmail:"Write a professional email about: ",pScript:"Write a YouTube video script about: ",pAd:"Write persuasive ad copy for: ",pCaption:"Write a catchy social media caption for: ",ex1:"Explain quantum computing in simple words",ex2:"Plan a 3-day trip to Tokyo",ex3:"Translate “good morning” into 5 languages",ex4:"A cozy illustration of a fox reading a book",secNote:"Your personal key (optional) is sto
